name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm run typecheck

      - name: 单元测试（kernel + 加载器）
        run: pnpm test

      # 文档是这个仓库交付物的一部分：相对链接与行内代码里的仓库路径必须存在。
      # 检查器自身的"坏链接会失败"由 packages/cli/test/doc-links.spec.ts 反向验证。
      - name: 文档链接检查
        run: pnpm run check:docs

      - name: 构建（插件 + Node 宿主 + Web 宿主）
        run: pnpm run build

      - name: 产物契约冒烟
        run: pnpm run smoke

      # 打包 + 校验真实 VSIX（读 ZIP 中央目录断言必需项在、源码/依赖不在）。
      # 这一步同时验证了 .vscodeignore 与扩展清单在 vsce 眼里是合法的。
      - name: 打包并校验 VSIX
        run: pnpm run verify:release

      # 说明（用户决策）：不跑 @vscode/test-electron e2e。
      # 桥接层的**逻辑**已由 packages/host/test/bridge.spec.ts 用 vscode stub 做契约测试
      # （权限门、命令表记账、副作用回收、只读配置视图、事件订阅）；
      # 真实 Electron 行为（例如 --permission 是否可用）仍只能靠 docs/acceptance-quick.md 手动验收。
      - name: 提示未覆盖范围
        run: echo "bridge.ts 的真实 Electron 行为需要手动验收；桥接层逻辑已由 bridge.spec.ts 覆盖"

      - uses: actions/upload-artifact@v4
        with:
          name: vscordis-vsix
          path: vscordis-local.vsix
